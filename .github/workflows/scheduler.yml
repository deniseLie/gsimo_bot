name: Telegram Scheduler

on:
  schedule:
      - cron: '0 8 * * 0'  # Sunday 4PM SGT / 8:00 UTC
      - cron: '0 8 * * 2'  # Tuesday 4PM SGT / 8:00 UTC
      - cron: '0 8 * * 5'  # Friday 4PM SGT / 8:00 UTC
  workflow_dispatch:     # Allows manual run

jobs:
  send:
    runs-on: ubuntu-latest  # GitHub gives you a free Linux VM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # Get your code from GitHub

      - name: Create google_api_credentials.json
        run: |
          mkdir -p gsimo_bot
          echo -E "${{ secrets.GOOGLE_API_CREDENTIALS }}" > gsimo_bot/google_api_credentials.json
          ls -l gsimo_bot/google_api_credentials.json

      - name: Build Docker image
        run: docker build -t telegram-bot .

      - name: Run Docker container
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
        run: | 
            docker run --rm \
              -e BOT_TOKEN="$BOT_TOKEN" \
              -e CHAT_ID="$CHAT_ID" \
              -e TOPIC_ID="$TOPIC_ID" \
              -e GOOGLE_CREDENTIALS_PATH="/google_api_credentials.json" \
              -v $GITHUB_WORKSPACE/gsimo_bot/google_api_credentials.json:/google_api_credentials.json:ro \
              telegram-bot
