name: Telegram Scheduler

on:
  schedule:
      # - cron: '0 8 * * 0'  # Sunday 4PM SGT / 8:00 UTC
      - cron: '0 8 * * 2'  # Tuesday 4PM SGT / 8:00 UTC
      - cron: '0 8 * * 5'  # Friday 4PM SGT / 8:00 UTC
  workflow_dispatch:     # Allows manual run

jobs:
  send:
    runs-on: ubuntu-latest  # GitHub gives you a free Linux VM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4  # Get your code from GitHub

      - name: Create google_api_credentials.json
        run: |
          mkdir -p gsimo_bot
          echo "${{ secrets.GOOGLE_API_CREDENTIALS }}" | sed 's/\\"/"/g' > gsimo_bot/google_api_credentials.json
          cat gsimo_bot/google_api_credentials.json

      - name: Validate JSON
        run: python -m json.tool gsimo_bot/google_api_credentials.json

      - name: Build Docker image
        run: docker build -t telegram-bot .

      - name: Run Docker container
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
        run: | 
            docker run --rm \
              -e BOT_TOKEN="$BOT_TOKEN" \
              -e CHAT_ID="$CHAT_ID" \
              -e TOPIC_ID="$TOPIC_ID" \
              -e GOOGLE_CREDENTIALS_PATH="/google_api_credentials.json" \
              -v $GITHUB_WORKSPACE/gsimo_bot/google_api_credentials.json:/google_api_credentials.json:ro \
              telegram-bot
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit only if repo has been inactive
        run: |
          DAYS_SINCE=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $DAYS_SINCE days ago"
          if [ "$DAYS_SINCE" -gt 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          else
            echo "Skipping keepalive — repo is still active"
          fi